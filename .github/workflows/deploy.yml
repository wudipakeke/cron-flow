name: Deploy CronFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Configure git to use SSH (HTTPS blocked by firewall)
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: actions/checkout@v4

      - name: Build & Deploy
        run: |
          echo "=== Building & restarting CronFlow ==="
          docker compose build
          docker compose up -d
          docker image prune -f
          echo "=== Deploy complete ==="

name: Deploy CronFlow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Configure git to use SSH (HTTPS blocked by firewall)
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: actions/checkout@v4

      - name: Build & Deploy
        run: |
          echo "=== Building & restarting CronFlow ==="
          docker compose down --remove-orphans 2>/dev/null || true
          docker compose build
          docker compose up -d

      - name: Health Check
        run: |
          echo "=== Health check ==="
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4001/ 2>/dev/null || echo "000")
            if [ "$status" != "000" ]; then
              echo "CronFlow OK (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i/12: not ready yet..."
            sleep 5
          done
          echo "FAILED: CronFlow did not respond"
          exit 1

      - name: Cleanup
        run: |
          docker image prune -f
          echo "=== Deploy complete ==="

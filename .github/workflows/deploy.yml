name: Deploy CronFlow to K3s

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NAMESPACE: mars-system
  CLUSTER_NAME: mars-cluster

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Configure git to use SSH (HTTPS blocked by firewall)
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - uses: actions/checkout@v4

      - name: Build CronFlow image
        run: |
          docker build -f docker/Dockerfile -t cronflow:latest .

      - name: Import image to k3d
        run: |
          k3d image import cronflow:latest -c ${{ env.CLUSTER_NAME }}

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/cronflow -n ${{ env.NAMESPACE }}
          kubectl rollout status deployment/cronflow -n ${{ env.NAMESPACE }} --timeout=120s

      - name: Health check
        run: |
          echo "=== Health check: CronFlow ==="
          for i in $(seq 1 12); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:4001/ 2>/dev/null || echo "000")
            if [ "$status" != "000" ]; then
              echo "CronFlow OK (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i/12: not ready yet..."
            sleep 5
          done
          echo "FAILED: CronFlow did not respond"
          exit 1

  release-summary:
    needs: deploy
    if: always()
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build summary data
        id: summary
        run: |
          COMMIT=$(git log --oneline -1 | cut -d' ' -f1)
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          RESULT="${{ needs.deploy.result }}"
          echo "result=$RESULT" >> $GITHUB_OUTPUT

      - name: Send Feishu notification
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
        run: |
          [ -z "$FEISHU_WEBHOOK_URL" ] && echo "FEISHU_WEBHOOK_URL 未配置，跳过通知" && exit 0

          RESULT="${{ steps.summary.outputs.result }}"
          COMMIT="${{ steps.summary.outputs.commit }}"

          if [ "$RESULT" = "success" ]; then
            COLOR="green"; STATUS_TEXT="✅ 部署成功"
          else
            COLOR="red"; STATUS_TEXT="❌ 部署失败"
          fi

          # 飞书签名验证
          TIMESTAMP=$(date +%s)
          KEY=$(printf '%s\n%s' "${TIMESTAMP}" "${FEISHU_WEBHOOK_SECRET}")
          SIGN=$(openssl dgst -sha256 -hmac "${KEY}" -binary < /dev/null | base64 -w 0)

          jq -n \
            --arg timestamp "$TIMESTAMP" \
            --arg sign "$SIGN" \
            --arg color "$COLOR" \
            --arg commit "$COMMIT" \
            --arg status "$STATUS_TEXT" \
            '{
              timestamp: $timestamp,
              sign: $sign,
              msg_type: "interactive",
              card: {
                config: { wide_screen_mode: true },
                header: { title: { tag: "plain_text", content: "🚀 CronFlow 部署通知" }, template: $color },
                elements: [
                  { tag: "div", text: { tag: "lark_md", content: ("**提交**: " + $commit + "\n**结果**: " + $status) } }
                ]
              }
            }' | curl -s -X POST -H "Content-Type: application/json" -d @- "$FEISHU_WEBHOOK_URL"